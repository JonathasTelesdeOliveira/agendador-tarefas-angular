<h2 mat-dialog-title class="hero-tile">➕{{ data.title }}</h2>
<mat-dialog-content>
  <form [formGroup]="form">
    @for (fild of fields; track fild.name) {
      <mat-form-field class="full-width">
        <mat-label>{{ fild.label }}</mat-label>
        <input matInput [type]="fild.type || 'text'" [formControlName]="fild.name" />

       @if( fild.button ) {
         <button matIconButton matSuffix (click)="fild.button.callback(form.get(fild.name)?.value, dialogRef)">
          <mat-icon> {{ fild.button.icon }}</mat-icon>
        </button>
       }
      </mat-form-field>
    }
  </form>
</mat-dialog-content>

<mat-dialog-actions>
  <button matButton (click)="onCancel()">Cancelar</button>
  <button matButton cdkFocusInitial (click)="onSave()">Ok</button>
</mat-dialog-actions>
