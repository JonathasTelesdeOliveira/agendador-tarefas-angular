<div class="register">
  <mat-card>
    <mat-card-header class="padding-m">
      <mat-card-title>Cadastro de usuário</mat-card-title><br />
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form">

        <mat-form-field class="full-width">
          <mat-label>Nome</mat-label>
          <input matInput formControlName="nome" placeholder="Digite seu Nome Completo" />
          @if(nomeError){
            <mat-error>{{nomeError}}</mat-error>
          }
     
        </mat-form-field>
        <mat-form-field class="full-width">
          <mat-label>Email</mat-label>
          <input matInput formControlName="email" placeholder="Digite seu email" />
          @if(emailError) {<mat-error>{{emailError}}</mat-error>}
        </mat-form-field>


        <input-passoword-field [control]="passowordControl" [placeholder]="'Cadastre a sua senha'"></input-passoword-field>

      </form>
    
    </mat-card-content>

<mat-divider />
    <section>
      <div>
        <button
          class="button-2"
          [disabled]="form.invalid || isLoading"
          (click)="submit()"
          type="submit"
          matButton="tonal"
        >{{ isLoading ? 'Cadastrando...' : 'Cadastrar' }}
        </button>
      </div>
    </section>
    <mat-divider />
      
      
  </mat-card>
</div>
