<div class="login">
  <mat-card>
    <mat-card-header class="padding-p">
      <mat-card-title>
        <p>
          Você deve efturar o<br />
          Login<br />
          ou estar conectado.
        </p>
      </mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form">
        <mat-form-field class="full-width">
          <mat-label>Email</mat-label>
          <input matInput formControlName="email" placeholder="Digite seu email" />
          @if (emailError) {
            <mat-error>{{ emailError }}</mat-error>
          }
        </mat-form-field>

        <input-passoword-field [control]="passowordControl"></input-passoword-field>
      </form>
    </mat-card-content>

    <mat-divider />
    <section>
      <div>
        <button
          class="button-2"
          [disabled]="form.invalid || isLoading"
          (click)="submit()"
          type="submit"
          matButton="tonal"
        >
          {{ isLoading ? 'Logando...' : 'Entrar' }}
        </button>
      </div>
    </section>
    <mat-divider />
  </mat-card>
</div>
