<div class="Home-hero">
  <div class="Hero-text">
    <h1>PASSOS <br><a>Cidadão Ativo</a></h1>
    <p>Participe da <a>comunidade</a> e faça a <a>diferença!</a></p>
    <p>
      Organize suas tarefas, eventos e compromissos de forma fácil e eficiente.<br />
      <a>Seja um Cidadão Ativo!</a>
    </p>
    <section>
      <div class="Hero-buttons">
        <button matButton="tonal" class="button-2" routerLink="/register">Comece agora</button>
        <button matButton="tonal" class="button-2" routerLink="/login">Já tenho conta</button>
      </div>
    </section>
  </div>
  <div class="Hero-img">
    <img [src]="imgHero" alt="Imagem de Cidadão Ativo" class="hero-image" />
  </div>
</div>
